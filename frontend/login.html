
<!--
    This is the .html for a simple login page. It has two input fields: one for the username and one for the password.
     Both fields are required. At the bottom is a button to complete the login.

    @author streitwies
-->

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div class="container">
    <h1 data-i18n="title_message"></h1>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="username" data-i18n="username"></label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password" data-i18n="password"></label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" data-i18n="login"></button>
    </form>
</div>
<script src="assets/js/script.js"></script>
</body>
</html>

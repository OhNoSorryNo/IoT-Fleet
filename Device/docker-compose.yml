
services:
  communicator:
    build:
      # point context to the parent "core" folder (the level above "device")
      context: ..
      # dockerfile is inside "Device/Communicator"
      dockerfile: Device/Communicator/Dockerfile
    container_name: communicator
    ports:
      - "8080:8080"
    networks:
      - server_app-network
      - device_network

  updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    container_name: updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9090:9090"
    networks:
      - device_network

  leds:
    build:
      context: leds
      dockerfile: Dockerfile
    container_name: leds
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "6060:6060"
    networks:
      - device_network

networks:
  server_app-network:
    external: true
  device_network:
    driver: bridge

  #curl -X PUT http://host.docker.internal:9090/update-image -H "Content-Type: application/json" -d '{"image_name": "nginx:latest", "container_name": "Firmware"}'

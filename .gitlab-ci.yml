stages:
  - build
  - test


build_job:
  stage: build
  script:
    - echo "Building the project..."

test_job:
  stage: test
  image: alpine:latest
  script:
    - apk add --no-cache maven openjdk17
    - echo "Running tests..."
    - mvn clean test

  artifacts:
    paths:
      - target
      - src
      - test

    expire_in: 40 week
  only:
    - main
    - develop

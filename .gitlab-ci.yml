stages:
  - build
  - test

build_job:
  stage: build
  script:
    - echo "Building the project..."

  artifacts:
    paths:
      - target
      - src
    expire_in: 40 week
  only:
    - main
    - develop
    - 51-unit-tests

test_job:
  stage: test
  script:
    - echo "Running tests..."
    - ./mvnw test  # Run the unit tests

  dependencies:
    - build_job
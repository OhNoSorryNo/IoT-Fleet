variables:
  MAVEN_OPTS: "-Xmx1024m"
stages:
  - build

build_job:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  script:
    - echo "Building the project..."
    - mvn clean package --batch-mode --fail-at-end
    - echo "Current working directory:"
    - pwd
    - mvn clean test --batch-mode --fail-at-end
  coverage: '/Total line coverage rate: [0-9|.]+/'
  artifacts:
    paths:
      - Device
      - Server
    expire_in: 40 week  # Artifacts will expire in 40 weeks
  only:
    - main
    - develop
    - jasmins-chaosLand
    - 100-code-coverage-gitlab-badges-testing

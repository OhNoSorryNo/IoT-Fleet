stages:
  - build
  - test


build_job:
  stage: build
  script:
    - echo "Building the project..."

test_job:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "Running tests..."
    - mvn clean test

  artifacts:
    paths:
      - target
      - src
      - test

    expire_in: 40 week
  only:
    - main
    - develop

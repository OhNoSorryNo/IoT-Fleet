variables:
  MAVEN_OPTS: "-Xmx1024m"
stages:
  - build
  - test

build_job:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  script:
    - echo "Building the project..."
    - mvn clean package --batch-mode --fail-at-end
    #- echo "Current working directory:"
    #- pwd
    #- mvn clean test --batch-mode --fail-at-end
    - echo "Build job complete."
  #coverage: '/Coverage:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - Device
      - Server
    expire_in: 40 week  # Artifacts will expire in 40 weeks
  only:
    - main
    - develop

test_job:
  stage: test
  image: maven:3.9.4-eclipse-temurin-21
  coverage: '/Coverage:\s+(\d+\.\d+)%/'
  #artifacts:
    #paths:
      #- Device
      #- Server
    #expire_in: 40 week
  script:
    # 1) Install xmllint
    - apt-get update
    - apt-get install -y libxml2-utils

    # 2) Go to the project root (where your parent POM is) so Maven sees all modules
    - cd $CI_PROJECT_DIR

    # 3) Run test across all modules (Server and Device/Communicator)
    - mvn clean test jacoco:report

    # 4) Confirm the coverage files exist in each submodule
    - echo "== Communicator coverage =="
    - ls -l Device/Communicator/target/site/jacoco/jacoco.xml
    - echo "== Server coverage =="
    - ls -l Server/target/site/jacoco/jacoco.xml

    # 5) Parse coverage from Communicator, then parse coverage from Server
    #    (You can do separate coverage or combine them manually)

    # Example: parse coverage from Communicator
    - |
      coverageValCommunicator=$(xmllint --xpath "
        sum(//counter[@type='INSTRUCTION']/@covered)
        div
        (
          sum(//counter[@type='INSTRUCTION']/@covered)
          + sum(//counter[@type='INSTRUCTION']/@missed)
        ) * 100
      " Device/Communicator/target/site/jacoco/jacoco.xml)

      echo "Communicator Coverage: ${coverageValCommunicator}%"

    # Example: parse coverage from Server
    - |
      coverageValServer=$(xmllint --xpath "
        sum(//counter[@type='INSTRUCTION']/@covered)
        div
        (
          sum(//counter[@type='INSTRUCTION']/@covered)
          + sum(//counter[@type='INSTRUCTION']/@missed)
        ) * 100
      " Server/target/site/jacoco/jacoco.xml)

      echo "Server Coverage: ${coverageValServer}%"

  only:
    - main
    - develop
stages:
  - build

build_job:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  script:
    - echo "Building the project..."
    - echo "Listing directory contents..."
    - ls -R  # Debug directory structure
    - echo "Displaying core/pom.xml..."
    - cat pom.xml  # Debug parent POM
    - echo "Running Maven build..."
    - mvn clean package --batch-mode --fail-at-end
  artifacts:
    paths:
      - server/target/*.jar              # Server JAR file
      - device/communicator/target/*.jar # Communicator JAR file
    expire_in: 40 week  # Artifacts will expire in 40 weeks
  only:
    - main
    - develop

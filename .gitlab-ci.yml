stages:
  - build

build_job:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  script:
    - echo "Building the project..."
    - mvn clean package --batch-mode --fail-at-end
    - echo "Listing files in the Server target directory:"
    - ls -R core/Server/target
    - echo "Listing files in the Communicator target directory:"
    - ls -R core/Device/Communicator/target
    - echo "Current working directory:"
    - pwd
  artifacts:
    paths:
      - /builds/ep/ws24_25/team_1/fleetmanagementsystem/core/Server/target/*.jar
      - /builds/ep/ws24_25/team_1/fleetmanagementsystem/core/Device/Communicator/target/*.jar
    expire_in: 40 week  # Artifacts will expire in 40 weeks
  only:
    - main
    - develop

variables:
  MAVEN_OPTS: "-Xmx1024m"
stages:
  - build
  - test

build_job:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  script:
    - echo "Building the project..."
    - mvn clean package --batch-mode --fail-at-end
    #- echo "Current working directory:"
    #- pwd
    #- mvn clean test --batch-mode --fail-at-end
    - echo "Build job complete."
  #coverage: '/Coverage:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - Device
      - Server
    expire_in: 40 week  # Artifacts will expire in 40 weeks
  only:
    - main
    - develop

test_job:
  stage: test
  image: maven:3.9.4-eclipse-temurin-21
  coverage: '/Coverage:\s+(\d+\.\d+)%/'
  #artifacts:
    #paths:
      #- Device
      #- Server
    #expire_in: 40 week
  script:
    # 1) Install xmllint for XML parsing
    - apt-get update && apt-get install -y libxml2-utils

    # 2) Merge coverage data from child modules
    - mvn -N -f pom.xml org.jacoco:jacoco-maven-plugin:merge@merge

    # 3) Generate a single merged JaCoCo report using the merged Jacoco.exec
    #    and the submodules' <classDirectories>.
    - mvn -N -f pom.xml org.jacoco:jacoco-maven-plugin:report@merged-report

    # 4) Parse coverage from target/merged-report/jacoco.xml
    - |
      coverageVal=$(xmllint --xpath "
        sum(//counter[@type='INSTRUCTION']/@covered)
        div
        (
          sum(//counter[@type='INSTRUCTION']/@covered)
          + sum(//counter[@type='INSTRUCTION']/@missed)
        ) * 100
      " target/merged-report/jacoco.xml || echo "Error parsing coverage XML")
      
      echo "Combined Coverage: ${coverageVal}%"

  only:
    - main
    - develop
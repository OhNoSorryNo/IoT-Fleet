variables:
  MAVEN_OPTS: "-Xmx1024m"
stages:
  - build
  - test

build_job:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  script:
    - echo "Building the project..."
    - mvn clean package --batch-mode --fail-at-end
    #- echo "Current working directory:"
    #- pwd
    #- mvn clean test --batch-mode --fail-at-end
    - echo "Build job complete."
  #coverage: '/Coverage:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - Device
      - Server
    expire_in: 40 week  # Artifacts will expire in 40 weeks
  only:
    - main
    - develop

test_job:
  stage: test
  image: maven:3.9.4-eclipse-temurin-21
  coverage: '/Coverage:\s+(\d+\.\d+)%/'
  #artifacts:
    #paths:
      #- Device
      #- Server
    #expire_in: 40 week
  script:
    # Install xmllint for XML parsing
    - apt-get update && apt-get install -y libxml2-utils

    # Run tests and generate coverage reports for Communicator module
    - echo "Testing Communicator module..."
    - cd Device/Communicator
    - mvn clean test jacoco:report
    - cd ../../

    # Run tests and generate coverage reports for Server module
    - echo "Testing Server module..."
    - cd Server
    - mvn clean test jacoco:report
    - cd ..

    # Merge the coverage data from Communicator and Server modules
    - echo "Merging coverage data..."
    - mvn org.jacoco:jacoco-maven-plugin:merge@merge -Djacoco.destFile=target/merged-jacoco.exec -Djacoco.dataFile1=Device/Communicator/target/jacoco.exec -Djacoco.dataFile2=Server/target/jacoco.exec || exit 1


    # Generate a combined JaCoCo coverage report
    - echo "Generating combined coverage report..."
    - mvn org.jacoco:jacoco-maven-plugin:report@report -Djacoco.dataFile=target/merged-jacoco.exec -DoutputDirectory=target/merged-report || exit 1

    # Parse the combined coverage percentage from the merged XML report
    - echo "Parsing combined coverage from target/merged-report/jacoco.xml..."
    - |
      if [ -f target/merged-report/jacoco.xml ]; then
        coverageVal=$(xmllint --xpath "
          sum(//counter[@type='INSTRUCTION']/@covered)
          div
          (
            sum(//counter[@type='INSTRUCTION']/@covered)
            + sum(//counter[@type='INSTRUCTION']/@missed)
          ) * 100
        " target/merged-report/jacoco.xml || echo "Error parsing coverage XML")
      
        echo "Combined Coverage: ${coverageVal}%"
      else
        echo "Coverage report not found: target/merged-report/jacoco.xml"
        exit 1
      fi

  only:
    - main
    - develop
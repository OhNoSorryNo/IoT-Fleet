<!--
    This is the .html for the dashboard page. It includes a navigation bar, a grid view for the agents, and popups for
    profile settings and notifications. This page can only be accessed if a user is logged in.

    @author streitwies
    @author jasmin1707
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="streitwies">
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const response = await fetch('/auth/check', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Error while authenticating login:', error);
                window.location.href = 'index.html';
            }
        });
    </script>

    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            background-color: #007bff;
            padding: 10px;
            color: white;
        }
        .navbar button {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-item h2 {
            font-size: 16px;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            margin-top: 10px;
        }

        .add-agent i {
            font-size: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 100%;
            max-width: 600px;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }
        .sidebar {
            width: 300px;
            right: 0;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<div class="navbar">
    <div class="title" data-i18n="navbar_title"></div>
    <div>
        <button class="nav-btn" id="filter-btn" data-i18n="filter_button"></button>
        <button class="nav-btn" id="profile-btn">
            <i class="fas fa-user"></i>
        </button>
        <button class="nav-btn" id="notifications-btn">
            <i class="fas fa-bell"></i>
        </button>
        <button class="nav-btn" id="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</div>

<!-- Agents (Grid View) -->
<div id="agents-grid" class="grid"></div>

<!-- Add Agent Popup -->
<div id="add-agent-popup" class="popup">
    <div class="popup-content">
        <span id="close-add-agent" class="close-btn">&times;</span>
        <h2 data-i18n="add-new-agent"></h2>
        <form id="add-agent-form">
            <label for="secret-key" data-i18n="secret_key_label"></label>
            <input type="text" id="secret-key" name="secret-key" placeholder="Enter Secret Key" required>
            <button type="submit" data-i18n="submit_button"></button>
        </form>
    </div>
</div>

<!-- Detail View Popup -->
<div id="agent-info-popup" class="popup">
    <div class="popup-content">
        <span id="close-agent-info" class="close-btn">&times;</span>
        <h2 data-i18n="agent_info_title"></h2>
        <ul id="agent-info-list"></ul>
    </div>
</div>

<!-- Profile Popup -->
<div id="profile-popup" class="popup">
    <div class="popup-content">
        <span id="close-profile" class="close-btn">&times;</span>
        <h2 data-i18n="profile_popup_title"></h2>
        <p data-i18n="profile_description"></p>
        <form>
            <label for="username" data-i18n="profile_username">:</label>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <button type="submit" data-i18n="save_button"></button>
        </form>
    </div>
</div>

<!-- Notifications Popup -->
<div id="notifications-popup" class="popup sidebar">
    <div class="popup-content">
        <span id="close-notifications" class="close-btn">&times;</span>
        <h2 data-i18n="notifications_popup_title">Notifications</h2>
        <ul>
            <li data-i18n="notification_1"></li>
            <li data-i18n="notification_2"></li>
            <li data-i18n="notification_3"></li>
        </ul>
    </div>
</div>

<script src="./js/script.js"></script>
</body>
</html>

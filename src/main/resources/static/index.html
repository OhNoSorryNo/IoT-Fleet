
<!--
    This is the .html for a simple login page. It has two input fields: one for the username and one for the password.
    Both fields are required. At the bottom is a button to complete the login and below that is a link to the register
    site in case the user does not yet have an account.

    @author streitwies
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="streitwies">
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1 data-i18n="title_login"></h1>
    <!--<form action="#" method="POST">-->
    <form id="loginForm" action="javascript:void(0);" method="POST">
    <div class="form-group">
            <label for="username" data-i18n="username_login"></label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password" data-i18n="password_login"></label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" data-i18n="login"></button>

    </form>

    <p class="register-link">
        <a href="register.html" data-i18n="register_button_on_login_site"></a>
    </p>
</div>
<script src="./js/script.js"></script>
</body>
</html>
